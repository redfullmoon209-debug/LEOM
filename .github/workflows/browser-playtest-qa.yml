name: LEOM free Chrome browser gameplay test
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'tools/preview_browser_qa.cjs'
      - '.github/workflows/browser-playtest-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium with software WebGL
        run: |
          npm install --prefix /tmp/leom-browser --no-save playwright@1.56.1
          /tmp/leom-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve real LEOM preview without Unity installation
        run: |
          python3 -m http.server 8799 --directory . >/tmp/leom-browser.log 2>&1 &
          echo "LEOM_SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: Test 3D render, UI, input and mobile
        env:
          PLAYWRIGHT_MODULE: /tmp/leom-browser/node_modules/playwright
        run: node tools/preview_browser_qa.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEOM-browser-preview-QA
          path: qa/
          if-no-files-found: warn
